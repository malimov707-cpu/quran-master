services:
  app:
    build:
      context: .
      target: production
    image: "${APP_IMAGE_NAME:-quran-ai-ustoz}:${APP_IMAGE_TAG:-latest}"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      APP_URL: "${APP_URL:?APP_URL is required}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-quran_ai_ustoz}"
      DB_USERNAME: "${DB_USERNAME:-quran}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      APP_DISPLAY_TIMEZONE: Asia/Tashkent
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: "${S3_BUCKET:-quran-media}"
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      target: production
    image: "${APP_IMAGE_NAME:-quran-ai-ustoz}:${APP_IMAGE_TAG:-latest}"
    command: ["queue"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      APP_URL: "${APP_URL:?APP_URL is required}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-quran_ai_ustoz}"
      DB_USERNAME: "${DB_USERNAME:-quran}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      APP_DISPLAY_TIMEZONE: Asia/Tashkent
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: "${S3_BUCKET:-quran-media}"
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage

  scheduler:
    build:
      context: .
      target: production
    image: "${APP_IMAGE_NAME:-quran-ai-ustoz}:${APP_IMAGE_TAG:-latest}"
    command: ["schedule"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      APP_URL: "${APP_URL:?APP_URL is required}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-quran_ai_ustoz}"
      DB_USERNAME: "${DB_USERNAME:-quran}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: "${S3_BUCKET:-quran-media}"
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-quran_ai_ustoz}"
      POSTGRES_USER: "${DB_USERNAME:-quran}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-quran} -d ${DB_DATABASE:-quran_ai_ustoz}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Avtomatik kundalik backup (scripts/backup.sh) — 03:00 da
  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do if [ $$(date +%H) -eq 3 ] && [ ! -f /backups/.done_today ]; then /scripts/backup.sh && touch /backups/.done_today; elif [ $$(date +%H) -ne 3 ]; then rm -f /backups/.done_today; fi; sleep 1800; done"]
    environment:
      DB_HOST: postgres
      DB_USERNAME: "${DB_USERNAME:-quran}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_DATABASE: "${DB_DATABASE:-quran_ai_ustoz}"
      BACKUP_DIR: /backups
      PGPASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  redis:
  storage:
  minio:
  backups:
